services:
  wake-model:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: wake-model
    restart: unless-stopped
    ports:
      # Keep private by default. Put a TLS reverse proxy in front for remote access.
      - "${WAKE_BIND_ADDRESS:-127.0.0.1}:${WAKE_RUNTIME_PORT:-8080}:8080"
    volumes:
      - "${WAKE_MODELS_DIR:-./models}:/models:ro"
    command:
      - "--model"
      - "/models/${WAKE_MODEL_FILE:?Set WAKE_MODEL_FILE in runtime/.env}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--ctx-size"
      - "${WAKE_CTX_SIZE:-4096}"
      - "--parallel"
      - "${WAKE_PARALLEL:-1}"
      - "--n-gpu-layers"
      - "${WAKE_GPU_LAYERS:-0}"
      - "--api-key"
      - "${WAKE_RUNTIME_API_KEY:?Set WAKE_RUNTIME_API_KEY in runtime/.env}"
    security_opt:
      - no-new-privileges:true
    init: true
    stop_grace_period: 60s
