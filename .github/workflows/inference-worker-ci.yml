name: Inference Worker CI

on:
  push:
    branches: ["main", "feat/**"]
    paths:
      - "inference-worker/**"
      - ".github/workflows/inference-worker-ci.yml"
  pull_request:
    paths:
      - "inference-worker/**"
      - ".github/workflows/inference-worker-ci.yml"

jobs:
  benchmark-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install safe image test dependency
        run: python -m pip install -r inference-worker/requirements.txt "Pillow>=11.0.0"
      - name: Run benchmark and runtime preflight tests
        run: python -m unittest discover -s inference-worker/benchmark -p "test_*.py" -v
      - name: Run offline runtime preflight
        run: python inference-worker/benchmark/runtime_preflight.py
      - name: Run mocked Qwen adapter tests
        env:
          PYTHONPATH: inference-worker
        run: python -m unittest discover -s inference-worker/tests -p "test_*.py" -v
      - name: Check Python syntax
        run: python -m compileall -q inference-worker/app inference-worker/benchmark inference-worker/tests
